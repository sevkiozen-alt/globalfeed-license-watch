name: Check licenses

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check licenses
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python watch.py
      - name: Commit changes
        run: |
          git config user.name "globalfeed-license-watch"
          git config user.email "globalfeed-license-watch@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Licenses checked $(date -u +%Y-%m-%d)"
          git push
      - name: Publish release for license changes
        if: hashFiles('release-notes.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="changes-$(date -u +%Y-%m-%d)"
          gh release create "$tag" --title "License changes $(date -u +%Y-%m-%d)" --notes-file release-notes.md
